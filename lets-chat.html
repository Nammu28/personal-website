<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Namrata — Let's Chat: contact and messages.">
  <title>Let's Chat! | Namrata</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a href="index.html" class="nav__logo">Namrata</a>
      <button class="nav__toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav__links">
        <li><a href="index.html#about">My Story</a></li>
        <li><a href="my-skills.html">My Skills</a></li>
        <li><a href="my-journey.html">My Journey</a></li>
        <li><a href="lets-chat.html">Let's Chat!</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="section section--destination" id="contact">
      <div class="container">
        <header class="section__header section__header--center">
          <p class="section__eyebrow">Next Stop</p>
          <h2 class="section__title">Let's Chat!</h2>
          <p class="section__subtitle">Have a project in mind? I'd love to hear from you.</p>
        </header>
        <form class="contact-form" action="#" method="post">
          <div class="form-row">
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" placeholder="Your name" required>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Tell me about your project..." required></textarea>
          </div>
          <button type="submit" class="btn btn--primary btn--full">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>&copy; 2026 Namrata. Built with care.</p>
      <div class="site-footer__social">
        <a href="#" aria-label="GitHub">GitHub</a>
        <a href="#" aria-label="LinkedIn">LinkedIn</a>
        <a href="#" aria-label="Email">Email</a>
      </div>
    </div>
  </footer>

  <script>
    const toggle = document.querySelector('.nav__toggle');
    const links = document.querySelector('.nav__links');

    toggle.addEventListener('click', () => {
      const open = links.classList.toggle('nav__links--open');
      toggle.setAttribute('aria-expanded', open);
    });

    links.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        links.classList.remove('nav__links--open');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
  </script>

</body>
</html>
